  <script>
    // Smooth cursor following + hover detection
    const arrow = document.querySelector('.custom-cursor-arrow');
    let mouseX = 0, mouseY = 0;
    let arrowX = 0, arrowY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    // Hover detection
    const interactiveElements = document.querySelectorAll(
      'a, button, input, textarea, [role="button"], .vw-btn-primary, ' +
      '.portfolio-video-card, .play-button, .watch-btn, .team-single, ' +
      '.single-portfolio, [href], .clickable'
    );

    interactiveElements.forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
    });

    function animateCursor() {
      arrowX += (mouseX - arrowX) * 0.16; // smooth follow
      arrowY += (mouseY - arrowY) * 0.16;

      arrow.style.left = `${arrowX}px`;
      arrow.style.top = `${arrowY}px`;

      requestAnimationFrame(animateCursor);
    }

    animateCursor();
  </script>
